name: ci

on:
  pull_request:
    branches:
      - trunk

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v2
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .

  maintainance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: Test updating
      shell: 'bash'
      run: |
        zig build -Dupdate -Dverbose

  user:
    strategy:
      matrix:
        repo:
          - glfw
          - cimgui
        os:
          - ubuntu
          - windows
          - macos
    runs-on: "${{ matrix.os }}-latest"
    steps:
    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"

    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: |
        zig fetch --save "${URL}"

    - name: Test building ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
      shell: 'bash'
      run: |
        case "${REPO}" in
        ( 'cimgui' )
          platforms="{$(zig build -Dlist-platforms -Dseparator=,)}"
          eval "zig build -Dverbose -Drenderers=Vulkan -Dplatforms=${platforms}" ;;
        ( * ) zig build -Dverbose ;;
        esac

    - name: Test ${{ matrix.repo }}.zig examples
      env:
        REPO: "${{ matrix.repo }}"
      shell: 'bash'
      run: |
        case "${REPO}" in
        ( 'cimgui' ) env -C ./examples zig build ;;
        ( * ) ;;
        esac
